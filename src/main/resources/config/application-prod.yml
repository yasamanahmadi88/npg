# Production rate limits — still protective, but high enough for normal portal use.
bucket4j:
  get:
    bucket-size: 200
    token-per-minute: 120
  post:
    bucket-size: 60
    token-per-minute: 60

portal:
  captcha:
    backUrl: https://npg.mci.ir
