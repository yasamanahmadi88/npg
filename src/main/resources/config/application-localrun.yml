# Local run profile: H2 in-memory database (no Oracle required).
logging:
  level:
    ROOT: INFO
    tech.jhipster: INFO
    ix.portal.npg: DEBUG

spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:npgportal;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=BEGIN,END,DAY,VALUE
    username:
    password:
    hikari:
      auto-commit: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_query_cache: false
  liquibase:
    contexts: test
  mail:
    host: localhost
    port: 25
  thymeleaf:
    cache: false

server:
  port: 8080

jhipster:
  security:
    authentication:
      jwt:
        base64-secret: 9aczYrcyYu5Kx97GDTCszQom6i7Quny4Tni/ayGcVKlw2Sl9K1F9zHxKSNj3jl25Pv3TzlL1E3g9T/6lxffvaQ==
        token-validity-in-seconds: 86400
        token-validity-in-seconds-for-remember-me: 2592000

mediation:
  bpmn:
    parser:
      url: http://localhost:9999
      active: false

captcha:
  enabled: false
  dev-bypass: true

ix:
  dispatcher:
    server:
      url: http://localhost:8888/dispatch
  reload:
    cache:
      url: http://localhost:8888/management/reload-cache

portal:
  captcha:
    backUrl: http://localhost:8080
