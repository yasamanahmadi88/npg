# ===================================================================
# Spring Boot configuration.
#
# This configuration will be overridden by the Spring profile you use,
# for example application-dev.yml if you use the "dev" profile.
#
# Boot 3 / Hibernate 6 migration notes:
# - Hibernate second-level cache is disabled temporarily.
# - Old Infinispan/Hibernate 5 cache properties are removed/commented.
# - SpringPhysicalNamingStrategy is replaced by Hibernate's naming strategy.
# ===================================================================

management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include:
          - configprops
          - env
          - health
          - info
          - jhimetrics
          - logfile
          - loggers
          - prometheus
          - threaddump
          - caches
          - liquibase
  endpoint:
    health:
      show-details: when_authorized
      roles: ROLE_ADMIN
      probes:
        enabled: true
    jhimetrics:
      enabled: true
  info:
    git:
      mode: full
  health:
    group:
      liveness:
        include: livenessState
      readiness:
        include: readinessState,datasource
    mail:
      enabled: false # When using the MailService, configure an SMTP server and set this to true
  prometheus:
    metrics:
      export:
        enabled: true
        step: 60s
  metrics:
    enable:
      http: true
      jvm: true
      logback: true
      process: true
      system: true
    distribution:
      percentiles-histogram:
        all: true
      percentiles:
        all: 0,0.5,0.75,0.95,0.99,1.0
    tags:
      application: ${spring.application.name}

spring:
  application:
    name: npgPortal
  profiles:
    # The commented value for `active` can be replaced with valid Spring profiles to load.
    # Otherwise, it will be filled in by Maven when building the JAR file.
    active: #spring.profiles.active#
    group:
      localrun:
        - localrun
      dev:
        - dev
        - api-docs
        # Uncomment to activate TLS for the dev profile.
        # - tls
  jmx:
    enabled: false
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
    properties:
      # hibernate.jdbc.time_zone: UTC
      hibernate.id.new_generator_mappings: true
      hibernate.connection.provider_disables_autocommit: true

      # Temporarily disabled during Boot 3 / Hibernate 6 migration.
      # The previous Infinispan/Hibernate 5 region factory is not compatible with Hibernate 6.
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_query_cache: false

      hibernate.generate_statistics: false

      # JDBC batching/fetching.
      hibernate.jdbc.batch_size: 25
      hibernate.order_inserts: true
      hibernate.order_updates: true
      hibernate.jdbc.fetch_size: 150

      # Hibernate query behavior.
      hibernate.criteria.literal_handling_mode: BIND
      hibernate.query.fail_on_pagination_over_collection_fetch: true
      hibernate.query.in_clause_parameter_padding: true

      # Disabled because old Infinispan/Hibernate 5 cache config is not valid for Hibernate 6.
      # hibernate.cache.infinispan.statistics: false
      # hibernate.cache.use_minimal_puts: true
      # hibernate.cache.infinispan.entity.expiration.lifespan: 3600000
      # hibernate.cache.infinispan.entity.memory.size: 1000
      # hibernate.cache.infinispan.jgroups_cfg: default-configs/default-jgroups-tcp.xml

  messages:
    basename: i18n/messages
  main:
    allow-bean-definition-overriding: true
  task:
    execution:
      thread-name-prefix: npg-portal-task-
      pool:
        core-size: 2
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: npg-portal-scheduling-
      pool:
        size: 2
  thymeleaf:
    mode: HTML
  output:
    ansi:
      console-available: true

server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: strict

# Properties to be exposed on the /info management endpoint.
info:
  # Comma separated list of profiles that will trigger the ribbon to show.
  display-ribbon-on-profiles: dev

# ===================================================================
# JHipster specific properties.
# ===================================================================

jhipster:
  clientApp:
    name: npgPortalApp

  # By default CORS is disabled. Uncomment/configure to enable.
  cors:
    allowed-origins: 'http://localhost:9000,http://172.20.200.17,http://172.20.200.16,https://tnpg.mci.ir,https://npg.mci.ir,https://172.20.200.17,https://172.20.200.16,http://tnpg.mci.ir,http://npg.mci.ir'
    allowed-methods: '*'
    allowed-headers: '*'
    exposed-headers: 'Authorization,Link,X-Total-Count,X-${jhipster.clientApp.name}-alert,X-${jhipster.clientApp.name}-error,X-${jhipster.clientApp.name}-params'
    allow-credentials: true
    max-age: 1800

  mail:
    from: npgPortal@localhost

  api-docs:
    default-include-pattern: ${server.servlet.context-path:}/api/.*
    management-include-pattern: ${server.servlet.context-path:}/management/.*
    title: npgPortal API
    description: npgPortal API documentation
    version: 0.0.1
    terms-of-service-url:
    contact-name:
    contact-url:
    contact-email:
    license: unlicensed
    license-url:

  security:
    content-security-policy: "default-src 'self'; frame-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://storage.googleapis.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com data:"

# ===================================================================
# Application specific properties.
# Add your own application properties here.
# ===================================================================

# application:

# Default values for bucket4j if there is no value for them in SETTING table
bucket4j:
  get:
    bucket-size: 15
    token-per-minute: 6
  post:
    bucket-size: 1
    token-per-minute: 6

# Default values for IX dispatcher/reload clients
ix:
  dispatcher:
    server:
      url: http://ix-dispatcher:8888/dispatch
  reload:
    cache:
      url: http://ix-dispatcher:8888/management/reload-cache

# Default values for captcha/public resource
portal:
  captcha:
    backUrl: http://localhost:8080
