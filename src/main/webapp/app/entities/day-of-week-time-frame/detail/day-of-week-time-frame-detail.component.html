<div class="row justify-content-center" *jhiHasPermission="['dayOfWeekTimeFrame', 'view']">
  <div class="col-8">
    @if (dayOfWeekTimeFrame) {
    <div>
      <h2 data-cy="dayOfWeekTimeFrameDetailsHeading">
        <span jhiTranslate="npgPortalApp.dayOfWeekTimeFrame.detail.title">Day Of Week Time Frame</span>
      </h2>
      <hr />
      <jhi-alert-error></jhi-alert-error>
      <jhi-alert></jhi-alert>
      <dl class="row-md jh-entity-details">
        <dt><span jhiTranslate="global.field.id">ID</span></dt>
        <dd>
          <span>{{ dayOfWeekTimeFrame.id }}</span>
        </dd>
        <dt><span jhiTranslate="npgPortalApp.dayOfWeekTimeFrame.day">Day</span></dt>
        <dd>
          <span>{{ detectLang(dayOfWeekTimeFrame.day) }}</span>
        </dd>
        <dt><span jhiTranslate="npgPortalApp.dayOfWeekTimeFrame.begin">Begin</span></dt>
        <dd>
          <span>{{ dayOfWeekTimeFrame.begin | num2time }}</span>
        </dd>
        <dt><span jhiTranslate="npgPortalApp.dayOfWeekTimeFrame.end">End</span></dt>
        <dd>
          <span>{{ dayOfWeekTimeFrame.end | num2time }}</span>
        </dd>
      </dl>
      <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Back</span>
      </button>
      <button type="button" [routerLink]="['/day-of-week-time-frame', dayOfWeekTimeFrame.id, 'edit']" class="btn btn-primary">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
      </button>
    </div>
    }
  </div>
</div>
