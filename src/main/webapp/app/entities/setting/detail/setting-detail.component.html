<div class="row justify-content-center">
  <div class="col-8">
    @if (setting) {
    <div>
      <h2 data-cy="settingDetailsHeading"><span jhiTranslate="npgPortalApp.setting.detail.title">Setting</span></h2>
      <hr />
      <jhi-alert-error></jhi-alert-error>
      <jhi-alert></jhi-alert>
      <dl class="row-md jh-entity-details">
        <dt><span jhiTranslate="global.field.id">ID</span></dt>
        <dd>
          <span>{{ setting.id }}</span>
        </dd>
        <dt><span jhiTranslate="npgPortalApp.setting.name">Name</span></dt>
        <dd>
          <span>{{ setting.name }}</span>
        </dd>
        <dt><span jhiTranslate="npgPortalApp.setting.key">Key</span></dt>
        <dd>
          <span>{{ setting.key }}</span>
        </dd>
        <dt><span jhiTranslate="npgPortalApp.setting.value">Value</span></dt>
        <dd>
          <span>{{ setting.value }}</span>
        </dd>
      </dl>
      <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Back</span>
      </button>
      <button type="button" [routerLink]="['/setting', setting.id, 'edit']" class="btn btn-primary">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
      </button>
    </div>
    }
  </div>
</div>
