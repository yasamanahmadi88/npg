<div class="row justify-content-center">
  <div class="col-8">
    @if (notificationTemplate) {
    <div>
      <h2 data-cy="notificationTemplateDetailsHeading">
        <span jhiTranslate="npgPortalApp.notificationTemplate.detail.title">Notification Template</span>
      </h2>
      <hr />
      <jhi-alert-error></jhi-alert-error>
      <jhi-alert></jhi-alert>
      <dl class="row-md jh-entity-details">
        <dt><span jhiTranslate="global.field.id">ID</span></dt>
        <dd>
          <span>{{ notificationTemplate.id }}</span>
        </dd>
        <dt><span jhiTranslate="npgPortalApp.notificationTemplate.templateCode">Template Code</span></dt>
        <dd>
          <span>{{ notificationTemplate.templateCode }}</span>
        </dd>
        <dt><span jhiTranslate="npgPortalApp.notificationTemplate.language">Language</span></dt>
        <dd>
          <span>{{ notificationTemplate.language }}</span>
        </dd>
        <dt><span jhiTranslate="npgPortalApp.notificationTemplate.content">Content</span></dt>
        <dd>
          <span>{{ notificationTemplate.content }}</span>
        </dd>
        <dt><span jhiTranslate="npgPortalApp.notificationTemplate.type">Type</span></dt>
        <dd>
          <span>{{ notificationTemplate.type }}</span>
        </dd>
      </dl>
      <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Back</span>
      </button>
      <button type="button" [routerLink]="['/notification-template', notificationTemplate.id, 'edit']" class="btn btn-primary">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
      </button>
    </div>
    }
  </div>
</div>
