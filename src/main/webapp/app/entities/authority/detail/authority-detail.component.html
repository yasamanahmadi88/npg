<div class="row justify-content-center">
  <div class="col-8">
    @if (authority) {
    <div>
      <h2><span jhiTranslate="npgPortalApp.authority.detail.title">Authority</span> {{ authority.id }}</h2>
      <hr />
      <jhi-alert-error></jhi-alert-error>
      <dl class="row-md jh-entity-details">
        <dt><span jhiTranslate="npgPortalApp.authority.name">Name</span></dt>
        <dd>
          <span>{{ authority.name }}</span>
        </dd>
        <dt><span jhiTranslate="npgPortalApp.authority.displayName">Display Name</span></dt>
        <dd>
          <span>{{ authority.displayName }}</span>
        </dd>
        <dt><span jhiTranslate="npgPortalApp.authority.parent">Parent</span></dt>
        <dd>
          @if (authority.parentId) {
          <div>
            <a [routerLink]="['/authority', authority.parentId, 'view']">{{ authority.parentDisplayName }}</a>
          </div>
          }
        </dd>
      </dl>
      <button type="submit" (click)="previousState()" class="btn btn-info">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Back</span>
      </button>
      <button type="button" [routerLink]="['/authority', authority.id, 'edit']" class="btn btn-primary">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
      </button>
    </div>
    }
  </div>
</div>
