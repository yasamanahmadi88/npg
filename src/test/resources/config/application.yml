# ===================================================================
# Spring Boot configuration.
#
# This configuration is used for unit/integration tests.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

spring:
  cache:
    type: simple
  # Uncomment the following line to enable tests against production database type rather than H2, using Testcontainers
  # profiles:
  #   active: testcontainers
  application:
    name: npgPortal
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:h2:mem:npgportal;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=BEGIN,END,DAY,VALUE
    name:
    username:
    password:
    hikari:
      auto-commit: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.hibernate.SpringImplicitNamingStrategy
    properties:
      hibernate.id.new_generator_mappings: true
      hibernate.connection.provider_disables_autocommit: true
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_query_cache: false
      hibernate.generate_statistics: false
      hibernate.hbm2ddl.auto: validate
      # hibernate.jdbc.time_zone: UTC
      hibernate.query.fail_on_pagination_over_collection_fetch: true
  liquibase:
    contexts: test
  mail:
    host: localhost
  main:
    allow-bean-definition-overriding: true
  messages:
    basename: i18n/messages
  task:
    execution:
      thread-name-prefix: npg-portal-task-
      pool:
        core-size: 1
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: npg-portal-scheduling-
      pool:
        size: 1
  thymeleaf:
    mode: HTML

server:
  port: 10344
  address: localhost

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
  clientApp:
    name: 'npgPortalApp'
  logging:
    # To test json console appender
    use-json-format: false
    logstash:
      enabled: false
      host: localhost
      port: 5000
  mail:
    from: test@localhost
    base-url: http://127.0.0.1:8080
  security:
    authentication:
      jwt:
        # This token must be encoded using Base64 (you can type `echo 'secret-key'|base64` on your command line)
        base64-secret: MTk0ZjI2YTg0ZDA1MGE1ZmM5ZmNiOTdhNzljOGE4MmZmMDM4YzVhN2U1NDQyNDBlNTI3N2ZlNDVjNGYzNDYwMDUwNjkzYTdjNTlhNTcxZDk5Y2ViODBiMDQ5OWVjYzNjN2MyNTMwNzg0MDFmZTc1OThjMThkNTNlMTczMDljOTA=
        # Token is valid 24 hours
        token-validity-in-seconds: 86400
# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

# application:

# Default values for bucket4j if there is no value for them in SETTING table
bucket4j:
  get:
    bucket-size: 15
    token-per-minute: 6
  post:
    bucket-size: 1
    token-per-minute: 6

# Test defaults for IX dispatcher/reload clients
ix:
  dispatcher:
    server:
      url: http://localhost:8888/dispatch
  reload:
    cache:
      url: http://localhost:8888/management/reload-cache

# Test defaults for captcha/public resource
portal:
  captcha:
    backUrl: http://localhost:10344
