server:
  port: 8080

spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=LEGACY;NON_KEYWORDS=VALUE,BEGIN,END,DAY
    username: npg
    password:
    driver-class-name: org.h2.Driver
    hikari:
      auto-commit: false
      poolName: Hikari
      maximum-pool-size: 1

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.hbm2ddl.auto: none
      hibernate.id.new_generator_mappings: true
      hibernate.connection.provider_disables_autocommit: true
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_query_cache: false
      hibernate.generate_statistics: false
      hibernate.jdbc.time_zone: UTC
      hibernate.query.fail_on_pagination_over_collection_fetch: true

  liquibase:
    enabled: true
    contexts: test

  sql:
    init:
      mode: never

  mail:
    host: localhost
    port: 25

jhipster:
  security:
    authentication:
      jwt:
        base64-secret: 9aczYrcyYu5Kx97GDTCszQom6i7Quny4Tni/ayGcVKlw2Sl9K1F9zHxKSNj3jl25Pv3TzlL1E3g9T/6lxffvaQ==
        token-validity-in-seconds: 86400
        token-validity-in-seconds-for-remember-me: 2592000

mediation:
  bpmn:
    parser:
      url: http://localhost:9999
      active: false
